
# Inner Visions Design - Pages CMS
media:
  input: assets
  output: assets

content:
  - name: homepage
    label: Homepage
    type: file
    path: content/home.json
    format: json
    fields:
      # Creative Studio
      - {name: studio_eyebrow, label: Studio tagline, type: string}
      - {name: studio_heading, label: Main headline, type: string}
      - {name: studio_accent, label: Pink headline text, type: string}
      - {name: studio_description, label: Introduction, type: text}
      - {name: studio_prompt_label, label: Creative prompt label, type: string}
      - {name: studio_category1, label: Branding button, type: string}
      - {name: studio_category2, label: Websites button, type: string}
      - {name: studio_category3, label: Apparel button, type: string}
      - {name: studio_category4, label: Online stores button, type: string}
      - {name: studio_category5, label: Marketing button, type: string}
      - {name: studio_ai_button, label: AI button text, type: string}
      - {name: studio_hire_button, label: Hire IVD button, type: string}
      - {name: studio_note, label: Studio availability notice, type: text}
      - {name: studio_tagline, label: Brand signature, type: string}

      # Services
      - {name: services_heading1, label: Services heading 1, type: string}
      - {name: services_heading2, label: Services heading 2, type: string}
      - {name: service1_title, label: Apparel service title, type: string}
      - {name: service1_description, label: Apparel description, type: text}
      - {name: service2_title, label: Branding service title, type: string}
      - {name: service2_description, label: Branding description, type: text}
      - {name: service3_title, label: Digital service title, type: string}
      - {name: service3_description, label: Digital description, type: text}

      # Portfolio
      - {name: work_heading1, label: Portfolio heading 1, type: string}
      - {name: work_heading2, label: Portfolio heading 2, type: string}
      - {name: project1_title, label: Project 1 title, type: string}
      - {name: project2_title, label: Project 2 title, type: string}
      - {name: project2_image, label: Project 2 image, type: image}
      - {name: portfolio_url, label: Portfolio website link, type: string}

      # About
      - {name: about_heading1, label: About heading 1, type: string}
      - {name: about_heading2, label: About heading 2, type: string}
      - {name: about_paragraph1, label: About paragraph 1, type: text}
      - {name: about_paragraph2, label: About paragraph 2, type: text}

      # Contact
      - {name: cta_heading1, label: Contact heading 1, type: string}
      - {name: cta_heading2, label: Contact heading 2, type: string}
